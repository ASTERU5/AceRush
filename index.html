<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#17563d;background-image:linear-gradient(45deg,#1b6446 25%,transparent 25%,transparent 75%,#1b6446 75%),linear-gradient(45deg,#1b6446 25%,transparent 25%,transparent 75%,#1b6446 75%);background-size:16px 16px;background-position:0 0,8px 8px;color:var(--ivory);font:10px/1.6 'Press Start 2P','Courier New',monospace;overflow:hidden;user-select:none;-webkit-user-select:none}

.px{background:var(--dk);border:4px solid #000;box-shadow:inset 0 0 0 2px #2c6a4d,0 4px 0 #000}

.bar i{position:absolute;inset:0;background:var(--gold);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .6s var(--sp)}

#modl{text-align:center;font-size:8px;color:#ff9a6a;min-height:14px}

#ht{color:#ff9a4d}

.deck,.back{background:var(--ink);background-image:linear-gradient(45deg,var(--b1,#8a3aa0) 25%,transparent 25%,transparent 75%,var(--b1,#8a3aa0) 75%),linear-gradient(45deg,var(--b1,#8a3aa0) 25%,var(--b2,#4b1f66) 25%,var(--b2,#4b1f66) 75%,var(--b1,#8a3aa0) 75%);background-size:12px 12px;background-position:0 0,6px 6px;box-shadow:inset 0 0 0 4px var(--ivory),3px 5px 0 #000}
#ctl{display:flex;gap:8px;justify-content:center;padding:2px 0 8px;flex-wrap:wrap}

button:hover:not(:disabled){transform:scale(1.1) rotate(-1.5deg)}button:active:not(:disabled){transform:translateY(4px) scale(.95)}
button:disabled{opacity:.4;cursor:default}button.s{background:#8a8f9c;box-shadow:inset -4px -4px 0 #555a66,inset 4px 4px 0 #c5c9d3,0 4px 0 #000}

.card:hover{transform:translate(var(--x,0),calc(var(--y,0px) - 26px)) rotate(var(--r,0)) scale(1.1);z-index:60!important}

.card.sel .fc{background-image:linear-gradient(#f0c04077,#f0c04077)}.card.scr .fc{box-shadow:inset 0 0 0 4px var(--gold),0 0 0 3px #000,0 5px 0 3px #000}
.card.sel:not(.scr) .fc{opacity:.75}
.in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s var(--sp)}.in.b{transform:rotateY(180deg)}
.fc,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:5px}
.fc{background:var(--cf,var(--ivory));box-shadow:inset 0 0 0 4px var(--ci,var(--ink)),0 5px 0 #000a;color:var(--ci,var(--ink))}.rd .fc{color:var(--cr,var(--red))}
.back{transform:rotateY(180deg)}

.cn{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:calc(var(--cw)/6.4);line-height:1}

.card.ghost{position:fixed;margin:0;bottom:auto;transition:none;pointer-events:none;z-index:200}
.fl{position:fixed;font-size:16px;pointer-events:none;z-index:180;text-shadow:2px 2px 0 #000}
#ov,#menu{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:14px;line-height:1.7}

h1{margin:0;font-weight:400;font-size:clamp(24px,7vw,56px);color:var(--gold)}

#ov h1{font-size:clamp(18px,5vw,34px)}

const decS=t=>{t=String(t).trim().replace(/^["'`]+|["'`]+$/g,'');if(t[0]!='{')t=t.replace(/\s/g,'');let j;const m=t.match(/^AR1-([A-Za-z0-9+/=]+)-([a-z0-9]+)$/i);if(m){j=atob(m[1]);let x=0;for(const ch of j)x=(x*31+ch.charCodeAt(0))>>>0;if(x.toString(36)!==m[2].toLowerCase())throw 0}else j=t[0]=='{'?t:atob(t);const o=JSON.parse(j);if(!o||typeof o!='object'||!('u' in o))throw 0;return cleanProg(o)};
function saveUI(mode){
if(mode=='ex'){const c=encS();ov(`<h1>EXPORT SAVE</h1><div class="sub">COPY THIS CODE AND KEEP IT SAFE</div><textarea id="sv" class="sv" readonly>${c}</textarea><div id="sm" class="sub" style="color:var(--gold)"></div><div class="row"><button id="scp">COPY</button><button id="sx" class="s">CLOSE</button></div>`);
const t=D.sv;t.onfocus=()=>t.select();setTimeout(()=>t.select(),60);
D.scp.onclick=async()=>{let ok=0;try{await navigator.clipboard.writeText(c);ok=1}catch(e){}if(!ok){t.select();try{ok=document.execCommand('copy')}catch(e){}}put(D.sm,ok?'COPIED!':'PRESS CTRL+C TO COPY THE SELECTED CODE')}}
else if(mode=='im'){ov(`<h1>IMPORT SAVE</h1><div class="sub">PASTE YOUR SAVE CODE</div><textarea id="sv" class="sv" placeholder="AR1-..."></textarea><div id="sm" class="sub" style="color:#ff9a6a"></div><div class="row"><button id="sld">LOAD</button><button id="sx" class="s">CANCEL</button></div>`);
D.sld.onclick=()=>{try{prog=decS(D.sv.value)}catch(e){put(D.sm,'THAT CODE IS NOT VALID');return}save();applyTheme();D.ov.classList.remove('on');menu();snd(784,.15,'square',.06)}}
else{ov(`<h1>RESET PROGRESS?</h1><div class="sub">ACT PROGRESS RESETS. COINS, STYLES AND TROPHIES ARE KEPT.</div><div class="row"><button id="syes">YES, RESET</button><button id="sx" class="s">CANCEL</button></div>`);
D.syes.onclick=()=>{prog=cleanProg({...prog,u:1,s:[]});save();D.ov.classList.remove('on');menu()}}
D.sx.onclick=()=>D.ov.classList.remove('on')}
D.rst.onclick=()=>saveUI('rs');D.ex.onclick=()=>saveUI('ex');D.im.onclick=()=>saveUI('im');
addEventListener('resize',()=>{size();upCW();layout()});
addEventListener('keydown',e=>{if(e.key==' '&&!/TEXTAREA|INPUT/.test(e.target.tagName))e.preventDefault();if(busy)return;if(e.key==' '||e.key=='Enter'){if(document.activeElement)document.activeElement.blur();play()}else if(e.key=='x'||e.key=='X'||e.key=='d'||e.key=='D')discard();else if(e.key>='1'&&e.key<='8'&&hand[e.key-1])toggle(hand[e.key-1])});
D.title.innerHTML=[...'ACE RUSH'].map((c,i)=>`<span style="--i:${i}">${c==' '?'&nbsp;':c}</span>`).join('');
for(let i=0;i<10;i++){const f=document.createElement('i');f.className='fs';f.style.cssText=`left:${(i*83)%96}%;top:${(i*37)%88}%;animation-delay:-${i*.4}s;background-image:${spr(i%4,i%4==1||i%4==2?'#d23c3c':'#0b1f17')}`;D.menu.append(f)}
D.tp.onclick=()=>tab(0);D.tsh.onclick=()=>tab(2);D.ta.onclick=()=>tab(1);D.suits.innerHTML=[0,1,2,3].map(i=>`<i class="hsu" style="--i:${i};background-image:${spr(i,i==1||i==2?'#d23c3c':'#f4ecd2')}"></i>`).join('');
applyTheme();
D.menu.insertAdjacentHTML('afterbegin',[...Array(9)].map((_,i)=>`<i class="fcard" style="--x:${i*11+2};--d:${14+i%4*4};--r:${i*37%60-30}deg;animation-delay:-${i*2.3}s"></i>`).join(''));
{const cn=document.createElement('span');cn.id='cn';cn.className=D.ds.className;D.ds.after(cn)}
setInterval(()=>{D.tip.textContent='TIP: '+TIPS[TI++%TIPS.length];D.tip.animate([{opacity:0},{opacity:1}],400)},4000);D.tip.textContent='TIP: '+TIPS[0];
const setMt=()=>put(D.mt,MUTE?'MUTED':'SOUND ON');setMt();
D.mt.onclick=()=>{MUTE=!MUTE;try{localStorage.setItem('arMute',MUTE?'1':'0')}catch(e){}setMt();snd(600,.1)};
addEventListener('click',e=>{if(e.target.closest('button,.act,.perk'))snd(520,.07,'square',.05,150)});

/* start screen */
D.stitle.innerHTML=D.title.innerHTML;
function begin(){if(D.start.classList.contains('off'))return;try{initAC()}catch(e){}snd(520,.07,'square',.05,150);D.start.classList.add('off');menu()}
D.go.onclick=begin;addEventListener('click',e=>{const b=e.target.closest('button');if(b)b.blur()});
addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&!D.start.classList.contains('off')){e.preventDefault();begin()}});
size();upCW();K={h:0,d:0,pc:0,m:0,t:0,b:0};menu();
</script>
